name: Release and deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: ["completed"]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'npm' }
      - run: npm ci
      # npm ci's `prepare` installs the dev pre-push hook. It refreshes the
      # challenge manifest from bitsocialnet, leaves the tree dirty and aborts
      # release-it's push, so CI would never tag and would deploy uncommitted
      # package versions. CI releases and builds master as committed.
      - name: Remove dev pre-push hook
        run: rm -f .git/hooks/pre-push
      - name: Configure git author
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: Run release-it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --ci || true
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      # deploy-pages looks the artifact up once, and the artifact service can
      # take seconds (up to ~1 min) to list a just-finalized upload, so the
      # lookup fails with "No artifacts named github-pages". Retry only the
      # deploy: a second upload makes the lookup fail with "Multiple artifacts".
      # Drop the retries once actions/deploy-pages#455 (or #451's fix) ships.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment_retry_1.outcome == 'failure'
        run: sleep 60
      - id: deployment_retry_2
        if: steps.deployment_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v4
